<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC Business – Inscription</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2d3436;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        font-size: 14px;
        margin-bottom: 5px;
        display: block;
        color: #333;
    }

    .input-group input, .input-group select {
        width: 97%;
        padding: 12px;
        border: 1px solid #d2d7df;
        border-radius: 8px;
        font-size: 15px;
    }

    .btn {
        width: 100%;
        margin-top: 5px;
        padding: 12px;
        font-size: 16px;
        border: none;
        background: #0066ff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    .btn:hover {
        background: #0050cc;
    }

    .alert {
        display: none;
        padding: 12px;
        margin-top: 10px;
        border-radius: 6px;
        text-align: center;
        font-size: 14px;
    }

    .alert-error {
        background: #ffe0e0;
        color: #c0392b;
    }

    .alert-success {
        background: #e0ffeb;
        color: #2ecc71;
    }

    .login-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">

    <h2>Créer un compte</h2>

    <div class="input-group">
        <label>Nom complet</label>
        <input type="text" id="name" placeholder="Votre nom ou entreprise">
    </div>
    
     <div class="input-group">
        <label>Photo link</label>
        <input type="link" id="link" placeholder="l'URL de votre photo de profil">
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Votre email">
    </div>

    <div class="input-group">
        <label>Téléphone</label>
        <input type="text" id="tel" placeholder="Numéro de téléphone">
    </div>

    <div class="input-group">
        <label>Type de compte</label>
        <select id="type">
            <option value="personnel">Personnel</option>
            <option value="entreprise">Entreprise</option>
        </select>
    </div>

    <div class="input-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Créer un mot de passe">
    </div>

    <button class="btn" id="signupBtn">Créer mon compte</button>

    <div id="alertBox" class="alert"></div>

    <div class="login-link">
        Déjà inscrit ? <a href="login.html">Se connecter</a>
    </div>

</div>


<!-- FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp,

        /* 🔹 AJOUT */
        collection,
        query,
        where,
        getDocs,
        updateDoc,
        increment,
        addDoc
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBla3D7OS8-Hx82m8Tz6ZPIS7FSLury3ew",
        authDomain: "cbc-business.firebaseapp.com",
        projectId: "cbc-business",
        storageBucket: "cbc-business.firebasestorage.app",
        messagingSenderId: "295952883135",
        appId: "1:295952883135:web:4624174a452c1f6aad950a",
        measurementId: "G-580W4D6J7E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const alertBox = document.getElementById("alertBox");

    function showAlert(text, type = "error") {
        alertBox.style.display = "block";
        alertBox.textContent = text;
        alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
    }

    /* 🔹 AJOUT : outils parrainage */
    function generateReferralCode(uid) {
        return uid.slice(0, 6) + Math.random().toString(36).slice(2, 6);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const refCodeFromUrl = urlParams.get("ref");

    document.getElementById("signupBtn").addEventListener("click", async () => {
        const name = document.getElementById("name").value.trim();
        const link = document.getElementById("link").value.trim();
        const email = document.getElementById("email").value.trim();
        const tel = document.getElementById("tel").value.trim();
        const type = document.getElementById("type").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!name || !email || !tel || !password) {
            showAlert("Veuillez remplir tous les champs.");
            return;
        }

        if (password.length < 6) {
            showAlert("Le mot de passe doit contenir au moins 6 caractères.");
            return;
        }

        try {
            // 🔹 Création du compte AUTH
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            const uid = cred.user.uid;

            /* 🔹 AJOUT */
            const myReferralCode = generateReferralCode(uid);

            // 🔹 Enregistrement dans Firestore
            await setDoc(doc(db, "users", uid), {
                userID: uid,
                name: name,
                email: email,
                tel: tel,
                type: type,
                date_inscription: serverTimestamp(),
                abonnements: [],
                active: false,
                boost : false,
                photoURL: link,
                verified: false,
                role: "user",

                /* 🔹 AJOUT */
                referralCode: myReferralCode,
                referralsCount: 0
            });

            /* 🔹 AJOUT : traitement du parrain */
            if (refCodeFromUrl) {
                const q = query(
                    collection(db, "users"),
                    where("referralCode", "==", refCodeFromUrl)
                );

                const snap = await getDocs(q);

                if (!snap.empty) {
                    const referrerDoc = snap.docs[0];
                    const referrerId = referrerDoc.id;

                    await updateDoc(doc(db, "users", referrerId), {
                        referralsCount: increment(1)
                    });

                    await addDoc(collection(db, "referrals"), {
                        referrerId: referrerId,
                        referredId: uid,
                        createdAt: serverTimestamp()
                    });
                }
            }

            showAlert("Compte créé avec succès ! Redirection...", "success");

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1300);

        } catch (error) {
            let msg = "Erreur inconnue.";

            switch (error.code) {
                case "auth/email-already-in-use":
                    msg = "Cet email est déjà utilisé.";
                    break;
                case "auth/invalid-email":
                    msg = "Email invalide.";
                    break;
                case "auth/weak-password":
                    msg = "Mot de passe trop faible.";
                    break;
            }

            showAlert(msg);
        }
    });
</script>
</body>
</html>
