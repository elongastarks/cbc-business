<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Laisser un avis – CBC Business</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f6f7fb;
}
header, footer{
  background:#0d6efd;
  color:#fff;
  padding:15px;
  text-align:center;
}
.container{
  max-width:500px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
textarea{
  width:100%;
  min-height:120px;
  resize:none;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}
.counter{
  text-align:right;
  font-size:12px;
  color:#666;
}
button{
  margin-top:15px;
  width:100%;
  padding:12px;
  background:#0d6efd;
  border:none;
  color:#fff;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.alert{
  margin-bottom:15px;
  font-size:14px;
}
.alert.error{color:#c00;}
.alert.success{color:#0a0;}
</style>
</head>

<body>

<header>CBC Business – Témoignage</header>

<div class="container">
  <h3>Laisser un témoignage</h3>
  <div id="alert" class="alert"></div>

  <textarea id="comment"
    maxlength="150"
    placeholder="Écrivez votre expérience avec CBC Business (150 caractères max)…">
  </textarea>

  <div class="counter">
    <span id="count">0</span> / 150
  </div>

  <button id="sendBtn">Envoyer</button>
</div>

<footer>© CBC Business</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla3D7OS8-Hx82m8Tz6ZPIS7FSLury3ew",
  authDomain: "cbc-business.firebaseapp.com",
  projectId: "cbc-business",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const textarea = document.getElementById("comment");
const counter = document.getElementById("count");
const alertBox = document.getElementById("alert");
const sendBtn = document.getElementById("sendBtn");

let currentUser;
let userData;

// compteur caractères
textarea.addEventListener("input", () => {
  counter.textContent = textarea.value.length;
});

// Auth check
onAuthStateChanged(auth, async user => {
  if(!user){
    alertBox.textContent = "Vous devez être connecté pour laisser un avis.";
    alertBox.className = "alert error";
    sendBtn.disabled = true;
    return;
  }

  currentUser = user;

  // récup user
  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);
  if(snap.exists()) userData = snap.data();
});

// Envoi
sendBtn.onclick = async () => {
  alertBox.textContent = "";
  const text = textarea.value.trim();

  if(text.length < 10){
    alertBox.textContent = "Message trop court.";
    alertBox.className = "alert error";
    return;
  }

  // Anti-spam : 1 avis / 24h
  const q = query(
    collection(db,"comments"),
    where("userID","==",currentUser.uid)
  );
  const snap = await getDocs(q);
  if(!snap.empty){
    alertBox.textContent = "Vous avez déjà envoyé un témoignage.";
    alertBox.className = "alert error";
    return;
  }

  await addDoc(collection(db,"comments"),{
    userID: currentUser.uid,
    name: userData?.name || "Utilisateur",
    comment: text,
    photoURL: userData?.photoURL || "",
    status: "pending",
    timestamp: serverTimestamp()
  });

  alertBox.textContent = "Merci ! Votre avis est en attente de validation.";
  alertBox.className = "alert success";
  textarea.value = "";
  counter.textContent = "0";
  sendBtn.disabled = true;
};
</script>
</body>
</html>
