<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres du profil | CBC Station</title>
<meta name="description" content="Gérez votre profil utilisateur sur CBC Station">
<meta name="robots" content="index, follow">
<script type="module" src="js/origine.js" defer></script>
<link rel="stylesheet" href="/css/set_user.css">
</head>

<body>

<header>
  <h1>CBC Station — Profil utilisateur</h1>
</header>

<div class="container">
  <h2>Modifier mon profil</h2>

  <div class="input-group">
    <label>Email (non modifiable)</label>
    <input type="email" id="email" class="readonly" disabled>
  </div>

  <div class="grid">

    <div class="input-group">
      <label>Nom *</label>
      <input type="text" id="name">
    </div>

    <div class="input-group">
      <label>Téléphone *</label>
      <input type="tel" id="tel">
    </div>

    <div class="input-group">
      <label>Type de compte</label>
      <select id="type">
        <option value="personnel">Personnel</option>
        <option value="entreprise">Entreprise</option>
      </select>
    </div>

    <div class="input-group">
      <label>Pays</label>
      <input type="text" id="country" value="RDC" disabled class="readonly">
    </div>

    <div class="input-group">
      <label>Province</label>
      <select id="province"></select>
    </div>

    <div class="input-group">
      <label>Ville</label>
      <select id="ville"></select>
    </div>

    <div class="input-group">
      <label>Disponibilité</label>
      <select id="availability">
        <option value="disponible">Disponible</option>
        <option value="occupé">Occupé</option>
      </select>
    </div>

    <div class="input-group">
      <label>Photo (URL)</label>
      <input type="text" id="photoURL">
    </div>

  </div>

  <div class="input-group">
    <label>Bio</label>
    <textarea id="bio" maxlength="150"></textarea>
  </div>

  <button id="saveBtn">Enregistrer</button>

  <div class="message" id="message"></div>
</div>

<script type="module" src="js/set_user.js"></script>

</body>
</html>
