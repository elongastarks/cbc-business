<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CBC Business</title>

<!-- ICONS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(180deg,#f5f7fa,#eef1f5);
  color: #2b2b2b;
  margin: 0;
}

.container {
  max-width: 1350px;
  margin: auto;
  padding: 20px;
}

/* HEADER */
header {
  background: #ffffff;
  border-radius: 14px;
  padding: 20px 25px;
  margin-bottom: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.06);
}

header h1 {
  font-size: 1.6rem;
  margin: 0;
}

/* PROFILE */
.profile-section {
  display: flex;
  gap: 20px;
  align-items: center;
}

.profile-img-container {
  position: relative;
}

.profile-img-container img {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #4da6ff;
}

.profile-info span {
  display: block;
  font-size: .9rem;
}

.verified-badge {
  margin-top: 5px;
  background: #4da6ff;
  color: #fff;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: .75rem;
  width: fit-content;
}

.photo-url-section {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.photo-url-section input {
  padding: 7px;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 110px;
}

/* ALERT */
.alert {
  display: none;
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}
.alert.success { background:#d4edda; color:#155724; }
.alert.error { background:#f8d7da; color:#721c24; }

/* DASHBOARD CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.06);
  position: relative;
}

.card h3 {
  margin: 0 0 12px;
  font-size: 1.2rem;
}

.card i {
  position: absolute;
  top: 18px;
  right: 18px;
  font-size: 1.4rem;
  color: #c2c7cf;
}

.card p {
  margin: 5px 0;
}

/* BUTTONS */
button {
  border: none;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

button.primary {
  background: #4da6ff;
  color: #fff;
}

button.secondary {
  background: #e0e0e0;
}

.copy-btn {
  background: #00c853;
  color: #fff;
}

/* SUPPORT & MESSAGES */
.section {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.section h2 {
  margin-top: 0;
}

.chat-item, .support-item {
  background: #f3f5f8;
  padding: 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.chat-item img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.chat-item .info {
  flex: 1;
}

.badge-unread {
  background: #ff4d4d;
  color: #fff;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: .75rem;
}

/* REFERRAL */
.referral-section {
  display: flex;
  gap: 8px;
}

.referral-section input {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

@media(max-width:768px){
  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>📊 Dashboard CBC Business</h1>
  <div class="profile-section">
    <div class="profile-img-container">
      <img id="profilePic" src="https://picsum.photos/80">
    </div>
    <div class="profile-info">
      <span id="userName">Nom</span>
      <span id="userEmail">email@example.com</span>
      <span id="userType">Type</span>
      <span id="verifiedBadge" class="verified-badge" style="display:none;">🔰 Vérifié</span>

      <div class="photo-url-section">
        <input type="text" id="profileURL" placeholder="URL photo">
        <button class="secondary" id="updatePhotoBtn">OK</button>
      </div>
    </div>
  </div>
</header>

<div id="alert" class="alert"></div>

<div class="cards">

  <div class="card">
    <i class="fa-solid fa-bullhorn"></i>
    <h3>Annonces <span id="annonceCount"></span></h3>
    <p>Total clics : <span id="totalClicks"></span></p>
    <button class="primary" onclick="location.href='viewAnnonces.html'">Voir</button>
  </div>

  <div class="card">
    <i class="fa-solid fa-cart-shopping"></i>
    <h3>Commandes <span id="commandTotal"></span></h3>
    <p>Dernière : <span id="commandLast"></span></p>
    <button class="primary" onclick="location.href='viewCommands.html'">Voir</button>
  </div>

  <div class="card">
    <i class="fa-solid fa-check-circle"></i>
    <h3>Rendus <span id="renduTotal"></span></h3>
    <p>Dernier : <span id="renduLast"></span></p>
    <button class="primary" onclick="location.href='setRendus.html'">Voir</button>
  </div>

  <div class="card">
    <i class="fa-solid fa-envelope-open-text"></i>
    <h3>Copywriting <span id="copyTotal"></span></h3>
    <p>Envoyés : <span id="copySend"></span></p>
  </div>

  <div class="card">
    <i class="fa-solid fa-headset"></i>
    <h3>Support</h3>
    <div class="support-item">
      <strong>Contacter le support</strong>
    </div>
  </div>

  <div class="card">
    <i class="fa-solid fa-share-nodes"></i>
    <h3>Parrainage</h3>
    <div class="referral-section">
      <input id="referralLink" readonly>
      <button class="copy-btn">Copier</button>
    </div>
  </div>

</div>

<div class="section">
  <h2>💬 Messages privés</h2>
  <div class="chat-list" id="chatList"></div>
</div>

</div>
<script>
  function copyReferral() {
    const input = document.getElementById("referralLink");
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value);
    alert("Lien de parrainage copié !");
  }
</script>
<script type="module">

/* =========================
   IMPORTS FIREBASE
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* =========================
   CONFIG FIREBASE
========================= */
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================
   ELEMENTS DOM
========================= */
const profilePic = document.getElementById("profilePic");
const profileURL = document.getElementById("profileURL");
const updatePhotoBtn = document.getElementById("updatePhotoBtn");
const profileUpload = document.getElementById("profileUpload");

const userName = document.getElementById("userName");
const userEmail = document.getElementById("userEmail");
const userType = document.getElementById("userType");
const verifiedBadge = document.getElementById("verifiedBadge");

const referralLinkInput = document.getElementById("referralLink");

const annonceCount = document.getElementById("annonceCount");
const totalClicks = document.getElementById("totalClicks");

const commandTotal = document.getElementById("commandTotal");
const commandLast = document.getElementById("commandLast");

const renduTotal = document.getElementById("renduTotal");
const renduLast = document.getElementById("renduLast");

const copyTotal = document.getElementById("copyTotal");
const copySend = document.getElementById("copySend");

const chatList = document.getElementById("chatList");
const supportList = document.getElementById("supportList");

/* =========================
   AUTH CHECK
========================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const uid = user.uid;
  await loadUserProfile(uid);
  await loadDashboardStats(uid);
  await loadMessages(uid);
  await loadSupport(uid);
});

/* =========================
   LOAD USER PROFILE
========================= */
async function loadUserProfile(uid) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) return;

  const data = snap.data();

  userName.textContent = data.name || "";
  userEmail.textContent = data.email || "";
  userType.textContent = data.type || "";

  profilePic.src = data.photoURL || "https://picsum.photos/80";
  profileURL.value = data.photoURL || "";

  // Header color + badge
  if (data.verified === true) {
    verifiedBadge.style.display = "inline-block";
    document.querySelector("header").style.borderBottom = "4px solid #4da6ff";
  } else {
    verifiedBadge.style.display = "none";
    document.querySelector("header").style.borderBottom = "4px solid red";
  }

  // Referral
  if (data.referralCode) {
    referralLinkInput.value =
      `${window.location.origin}/signup.html?ref=${data.referralCode}`;
  }
}

/* =========================
   UPDATE PHOTO URL
========================= */
updatePhotoBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return;

  const url = profileURL.value.trim();
  if (!url) return;

  await updateDoc(doc(db, "users", user.uid), {
    photoURL: url
  });

  profilePic.src = url;
});

/* =========================
   DASHBOARD STATS
========================= */
async function loadDashboardStats(uid) {

  /* ---------- ANNONCES ---------- */
  const qAnnonce = query(
    collection(db, "annonces"),
    where("userID", "==", uid)
  );

  const snapAnnonce = await getDocs(qAnnonce);

  let clicks = 0;
  snapAnnonce.forEach(d => {
    clicks += d.data().clicks || 0;
  });

  annonceCount.textContent = snapAnnonce.size;
  totalClicks.textContent = clicks;

  /* ---------- COMMANDS ---------- */
  const qCmd = query(
    collection(db, "commands"),
    where("gestID", "==", uid),
    orderBy("date_commande", "desc"),
    limit(1)
  );

  const snapCmd = await getDocs(qCmd);
  commandTotal.textContent = snapCmd.size;
  snapCmd.forEach(d => {
    commandLast.textContent = new Date(
      d.data().date_commande.seconds * 1000
    ).toLocaleDateString();
  });

  /* ---------- RENDUS ---------- */
  const qRendu = query(
    collection(db, "rendus"),
    where("byID", "==", uid),
    orderBy("date_rendu", "desc"),
    limit(1)
  );

  const snapRendu = await getDocs(qRendu);
  renduTotal.textContent = snapRendu.size;
  snapRendu.forEach(d => {
    renduLast.textContent = new Date(
      d.data().date_rendu.seconds * 1000
    ).toLocaleDateString();
  });

  /* ---------- COPYWRITING ---------- */
  const qCopy = query(
    collection(db, "copywriting"),
    where("userID", "==", uid)
  );

  const snapCopy = await getDocs(qCopy);
  copyTotal.textContent = snapCopy.size;

  let sent = 0;
  snapCopy.forEach(d => {
    sent += d.data().send || 0;
  });
  copySend.textContent = sent;
}

/* =========================
   MESSAGES (NO SNAPSHOT)
========================= */
async function loadMessages(uid) {
  chatList.innerHTML = "";

  const qChat = query(
    collection(db, "chat"),
    where("active", "==", true)
  );

  const snapChat = await getDocs(qChat);
  let hasChat = false;

  for (const d of snapChat.docs) {
    const c = d.data();
    if (c.userID1 !== uid && c.userID2 !== uid) continue;

    hasChat = true;
    const otherID = c.userID1 === uid ? c.userID2 : c.userID1;

    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerHTML = `
      <div class="info">
        <span class="name">${otherID}</span>
        <span class="last-msg">${c.lastMessage || ""}</span>
      </div>
    `;

    div.onclick = () => {
      window.location.href = `chat.html?uid=${otherID}`;
    };

    chatList.appendChild(div);
  }

  if (!hasChat) {
    chatList.innerHTML = `<p style="opacity:.5">Aucune discussion</p>`;
  }
}

/* =========================
   SUPPORT (TOUJOURS CLIQUABLE)
========================= */
async function loadSupport(uid) {
  supportList.innerHTML = "";

  const qSupport = query(
    collection(db, "support"),
    where("userID", "==", uid),
    orderBy("timestamp", "desc"),
    limit(1)
  );

  await getDocs(qSupport); // info inutile volontairement

  const div = document.createElement("div");
  div.className = "support-item";
  div.innerHTML = `<span class="name">Support / Admin</span>`;
  div.onclick = () => {
    window.location.href = `support.html?uid=${uid}`;
  };

  supportList.appendChild(div);
}

/* =========================
   COPY REFERRAL
========================= */
window.copyReferral = function () {
  referralLinkInput.select();
  referralLinkInput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(referralLinkInput.value);
};

</script>
</body>
</html>
