<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paramètres du profil | CBC Business</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 0;
}

header {
  background: #0d1b2a;
  color: #fff;
  padding: 15px 20px;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  background: #fff;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.08);
}

.container h2 {
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 15px;
}

.input-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.input-group input,
.input-group select {
  width: 100%;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.readonly {
  background: #eee;
  cursor: not-allowed;
}

button {
  width: 100%;
  padding: 12px;
  background: #1b263b;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #415a77;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>CBC Business — Paramètres utilisateur</h1>
</header>

<div class="container">
  <h2>Modifier mon profil</h2>

  <div class="input-group">
    <label>Email (non modifiable)</label>
    <input type="email" id="email" class="readonly" disabled>
  </div>

  <div class="input-group">
    <label>Nom *</label>
    <input type="text" id="name" required>
  </div>

  <div class="input-group">
    <label>Téléphone *</label>
    <input type="tel" id="tel" required>
  </div>

  <div class="input-group">
    <label>Type de compte *</label>
    <select id="type">
      <option value="personnel">Personnel</option>
      <option value="entreprise">Entreprise</option>
    </select>
  </div>

  <div class="input-group">
    <label>Photo de profil (URL)</label>
    <input type="text" id="photoURL" placeholder="https://...">
  </div>

  <button id="saveBtn">Enregistrer les modifications</button>

  <div class="message" id="message"></div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const emailEl = document.getElementById("email");
const nameEl = document.getElementById("name");
const telEl = document.getElementById("tel");
const typeEl = document.getElementById("type");
const photoEl = document.getElementById("photoURL");
const msgEl = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

let currentUID = null;

// 🔹 Charger données utilisateur
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUID = user.uid;
  emailEl.value = user.email;

  const ref = doc(db, "users", currentUID);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    const data = snap.data();
    nameEl.value = data.name || "";
    telEl.value = data.tel || "";
    typeEl.value = data.type || "personnel";
    photoEl.value = data.photoURL || "";
  }
});

// 🔹 Sauvegarde
saveBtn.addEventListener("click", async () => {
  if (!currentUID) return;

  const name = nameEl.value.trim();
  const tel = telEl.value.trim();

  if (!name || !tel) {
    msgEl.style.color = "red";
    msgEl.textContent = "Veuillez remplir les champs obligatoires.";
    return;
  }

  try {
    await updateDoc(doc(db, "users", currentUID), {
      name: name,
      tel: tel,
      type: typeEl.value,
      photoURL: photoEl.value
    });

    msgEl.style.color = "green";
    msgEl.textContent = "Profil mis à jour avec succès ✅";
  } catch (err) {
    msgEl.style.color = "red";
    msgEl.textContent = "Erreur lors de la mise à jour.";
    console.error(err);
  }
});
</script>
</body>
</html>
