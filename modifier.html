<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Modifier l’annonce | CBC Business</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }

    /* ===== HEADER ===== */
    header {
      background: #0f172a;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header img {
      height: 40px;
    }

    header .actions {
      display: flex;
      gap: 10px;
    }

    header button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    header button.secondary {
      background: #475569;
    }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* ===== SECTIONS ===== */
    .section {
      background: #fff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 18px;
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .form-row .form-group {
      flex: 1;
      min-width: 220px;
    }

    .save-btn {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    /* ===== STATS ===== */
    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 200px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-box strong {
      font-size: 22px;
      display: block;
    }

    /* ===== ACTIONS ===== */
    .actions-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .actions-row button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-active {
      background: #16a34a;
      color: #fff;
    }

    .btn-pending {
      background: #f59e0b;
      color: #fff;
    }

    .btn-commands {
      background: #2563eb;
      color: #fff;
    }

    /* ===== DANGER ZONES ===== */
    .danger {
      border-left: 5px solid #f59e0b;
      background: #fff7ed;
    }

    .danger.red {
      border-left-color: #dc2626;
      background: #fef2f2;
    }

    .danger button {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

  </style>
</head>
<body>

<header>
  <img src="cbc.jpg" alt="CBC Business">
  <div class="actions">
    <button class="secondary" onclick="location.href='dashboard.html'">⬅ Dashboard</button>
    <button onclick="location.href='commande.html?annonceID=XXX'">Voir les commandes</button>
  </div>
</header>

<div class="container">
  <h1>Modifier l’annonce</h1>

  <!-- ===== FORM ANNONCE ===== -->
  <div class="section">
    <h2>Informations de l’annonce</h2>

    <div class="form-group">
      <label>Titre</label>
      <input type="text" placeholder="Titre de l’annonce">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea placeholder="Description détaillée"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Catégorie</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Salaire / Budget</label>
        <input type="number">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Ville</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Province</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Lieu</label>
        <input type="text">
      </div>
    </div>

    <div class="form-group">
      <label>Statut</label>
      <select>
        <option value="actif">Actif</option>
        <option value="pending">Pending (fermée)</option>
      </select>
    </div>

    <button class="save-btn">Enregistrer les modifications</button>
  </div>

  <!-- ===== STATS ===== -->
  <div class="section">
    <h2>Statistiques de l’annonce</h2>

    <div class="stats">
      <div class="stat-box">
        👁 Vues
        <strong>0</strong>
      </div>
      <div class="stat-box">
        🖱 Clics
        <strong>0</strong>
      </div>
      <div class="stat-box">
        🛒 Commandes
        <strong>0</strong>
      </div>
    </div>
  </div>

  <!-- ===== ACTIONS RAPIDES ===== -->
  <div class="section">
    <h2>Actions rapides</h2>
    <div class="actions-row">
      <button class="btn-active">Activer</button>
      <button class="btn-pending">Mettre en pause</button>
      <button class="btn-commands">Voir les commandes</button>
    </div>
  </div>

  <!-- ===== RENDU ===== -->
  <div class="section danger">
    <h2>Marquer comme rendu</h2>

    <div class="form-group">
      <label>Note / Évaluation</label>
      <textarea></textarea>
    </div>

    <div class="form-group">
      <label>UserID du client (forID)</label>
      <input type="text" placeholder="Demander l'ID au client">
    </div>

    <button>Marquer comme rendu</button>
  </div>

  <!-- ===== SUPPRESSION ===== -->
  <div class="section danger red">
    <h2>Supprimer l’annonce</h2>
    <p>⚠️ Cette action est irréversible.</p>
    <button>Supprimer définitivement</button>
  </div>

</div>
<script type="module">
/* =========================
   FIREBASE IMPORTS
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  deleteDoc,
  collection,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

/* =========================
   CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBla3D7OS8-Hx82m8Tz6ZPIS7FSLury3ew",
  authDomain: "cbc-business.firebaseapp.com",
  projectId: "cbc-business"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================
   DOM
========================= */
const params = new URLSearchParams(window.location.search);
const annonceID = params.get("annonceID");

const titreInput = document.querySelector("input[placeholder='Titre de l’annonce']");
const descInput = document.querySelector("textarea[placeholder='Description détaillée']");
const catInput = document.querySelector("input[placeholder='Catégorie']");
const salaireInput = document.querySelector("input[placeholder='Salaire / Budget']");
const villeInput = document.querySelector("input[placeholder='Ville']");
const provinceInput = document.querySelector("input[placeholder='Province']");
const lieuInput = document.querySelector("input[placeholder='Lieu']");
const statutSelect = document.querySelector("select");

const saveBtn = document.querySelector(".save-btn");
const btnActive = document.querySelector(".btn-active");
const btnPending = document.querySelector(".btn-pending");
const btnCommands = document.querySelector(".btn-commands");

const renduTextarea = document.querySelector(".danger textarea");
const renduInput = document.querySelector(".danger input");
const renduBtn = document.querySelector(".danger button");

const deleteBtn = document.querySelector(".danger.red button");

const statsBoxes = document.querySelectorAll(".stat-box strong");

/* =========================
   STATE
========================= */
let currentUser;
let annonceData;

/* =========================
   AUTH
========================= */
onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  await loadAnnonce();
});

/* =========================
   LOAD ANNONCE
========================= */
async function loadAnnonce() {
  if (!annonceID) {
    alert("Annonce introuvable.");
    window.location.href = "dashboard.html";
    return;
  }

  const docRef = doc(db, "annonces", annonceID);
  const snap = await getDoc(docRef);

  if (!snap.exists()) {
    alert("Annonce introuvable.");
    window.location.href = "dashboard.html";
    return;
  }

  annonceData = snap.data();

  // Sécurité : seul le propriétaire
  if (annonceData.userID !== currentUser.uid) {
    alert("Vous n'avez pas accès à cette annonce.");
    window.location.href = "dashboard.html";
    return;
  }

  // Pré-remplir le formulaire
  titreInput.value = annonceData.titre || "";
  descInput.value = annonceData.description || "";
  catInput.value = annonceData.categorie || "";
  salaireInput.value = annonceData.salaire || "";
  villeInput.value = annonceData.ville || "";
  provinceInput.value = annonceData.province || "";
  lieuInput.value = annonceData.lieu || "";
  statutSelect.value = annonceData.etat || "actif";

  // Stats
  statsBoxes[0].textContent = annonceData.views || 0;
  statsBoxes[1].textContent = annonceData.clicks || 0;
  statsBoxes[2].textContent = annonceData.commands || 0;

  // btnCommands redirige vers commande.html
  btnCommands.onclick = () => {
    window.location.href = `commande.html?annonceID=${annonceID}`;
  };
}

/* =========================
   SAVE MODIFICATIONS
========================= */
saveBtn.onclick = async () => {
  const updatedData = {
    titre: titreInput.value.trim(),
    description: descInput.value.trim(),
    categorie: catInput.value.trim(),
    salaire: Number(salaireInput.value),
    ville: villeInput.value.trim(),
    province: provinceInput.value.trim(),
    lieu: lieuInput.value.trim(),
    etat: statutSelect.value,
    updatedAt: serverTimestamp()
  };

  await updateDoc(doc(db, "annonces", annonceID), updatedData);
  alert("Annonce mise à jour !");
};

/* =========================
   ACTIONS RAPIDES
========================= */
btnActive.onclick = async () => {
  await updateDoc(doc(db, "annonces", annonceID), { etat: "actif" });
  statutSelect.value = "actif";
  alert("Annonce activée !");
};

btnPending.onclick = async () => {
  await updateDoc(doc(db, "annonces", annonceID), { etat: "pending" });
  statutSelect.value = "pending";
  alert("Annonce mise en pause !");
};

/* =========================
   MARQUER COMME RENDU
========================= */
renduBtn.onclick = async () => {
  const note = renduTextarea.value.trim();
  const forID = renduInput.value.trim();

  if (!note || !forID) {
    alert("Veuillez remplir la note et le UserID du client.");
    return;
  }

  // Vérifier que le forID existe dans users
  const q = query(collection(db, "users"), where("uid", "==", forID));
  const snap = await getDocs(q);
  if (snap.empty) {
    alert("UserID du client introuvable.");
    return;
  }

  // Créer le rendu
  await updateDoc(doc(db, "annonces", annonceID), { etat: "rendu" });

  await addDoc(collection(db, "rendus"), {
    annonceID,
    byID: currentUser.uid,
    forID,
    note,
    date_rendu: serverTimestamp(),
    titre: annonceData.titre || "",
    categorie: annonceData.categorie || ""
  });

  alert("Annonce marquée comme rendu !");
};

/* =========================
   SUPPRESSION ANNONCE
========================= */
deleteBtn.onclick = async () => {
  if (!confirm("Êtes-vous sûr de vouloir supprimer définitivement cette annonce ?")) return;
  await deleteDoc(doc(db, "annonces", annonceID));
  alert("Annonce supprimée !");
  window.location.href = "dashboard.html";
};
</script>
</body>
</html>
