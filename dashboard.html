<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC Business - Dashboard</title>
<style>
/* RESET & BASE */
* { margin:0; padding:0; box-sizing:border-box; font-family: "Segoe UI", sans-serif; }
body { background:#f4f6f9; color:#333; }

/* HEADER */
header {
  display:flex; justify-content:space-between; align-items:center;
  padding:1rem 2rem; background:#1e1e2f; color:#fff;
}
header h1 { font-size:1.5rem; }
header .btn-home { color:#fff; text-decoration:none; background:#ffcc00; padding:0.4rem 0.8rem; border-radius:4px; }

/* LAYOUT PRINCIPAL */
.container { max-width:1200px; margin:auto; padding:1rem; display:grid; grid-template-columns: 1fr 3fr; gap:1.5rem; }

/* PROFIL */
.profile-section {
  background:#fff; padding:1.5rem; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);
  text-align:center;
}
.profile-section img { width:120px; height:120px; border-radius:50%; object-fit:cover; margin-bottom:1rem; }
.profile-section input { width:90%; padding:0.5rem; margin-bottom:0.5rem; border:1px solid #ccc; border-radius:6px; }
.profile-section button { padding:0.5rem 1rem; background:#1e1e2f; color:#fff; border:none; border-radius:6px; cursor:pointer; }
.profile-section button:hover { background:#333; }

/* DASHBOARD CARDS */
.dashboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; }

.card {
  background:#fff; padding:1rem 1.5rem; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); position:relative;
  display:flex; flex-direction:column; justify-content:space-between;
}
.card h3 { margin-bottom:0.8rem; color:#1e1e2f; }
.card p { font-size:0.9rem; margin:0.3rem 0; }
.card .badge { display:inline-block; padding:0.2rem 0.5rem; border-radius:4px; font-size:0.75rem; margin-left:0.5rem; color:#fff; }
.badge.urgent { background:#e74c3c; }
.badge.boost { background:#f1c40f; color:#000; }
.badge.verified { background:#27ae60; }

/* TABLE */
table { width:100%; border-collapse:collapse; }
th, td { padding:0.6rem 0.8rem; border-bottom:1px solid #ddd; font-size:0.85rem; text-align:left; }
th { background:#f0f0f0; }

/* MESSAGERIE */
.chat-section { grid-column:1/-1; background:#fff; padding:1rem; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
.chat-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.chat-header h3 { margin:0; }
.chat-header .unread { background:#e74c3c; color:#fff; padding:0.2rem 0.5rem; border-radius:50%; font-size:0.75rem; }
.chat-list { max-height:300px; overflow-y:auto; }
.chat-item { display:flex; align-items:center; gap:0.8rem; padding:0.5rem 0; border-bottom:1px solid #eee; cursor:pointer; transition:0.2s; }
.chat-item:hover { background:#f0f0f0; border-radius:6px; }
.chat-item img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
.chat-item .info { display:flex; flex-direction:column; }
.chat-item .info .name { font-weight:600; font-size:0.9rem; }
.chat-item .info .last-msg { font-size:0.8rem; color:#555; }

/* RESPONSIVE */
@media(max-width:900px){ .container { grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <h1>CBC Business - Dashboard</h1>
  <a href="index.html" class="btn-home">Accueil</a>
</header>

<div class="container">

  <!-- PROFIL -->
  <section class="profile-section">
    <img id="profilePic" src="https://picsum.photos/120/120" alt="Profil">
    <input type="text" id="photoURL" placeholder="Lien photo">
    <button id="updatePhoto">Mettre à jour</button>
    <p><strong id="userName">Nom</strong></p>
    <p id="userEmail">Email</p>
    <p id="userType">Type</p>
  </section>

  <!-- DASHBOARD STATS -->
  <div class="dashboard">
    <div class="card">
      <h3>Annonces <span class="badge urgent" id="urgentBadge">URG</span></h3>
      <p>Total publiées: <span id="annonceCount">0</span></p>
      <p>Total clics: <span id="totalClicks">0</span></p>
    </div>
    <div class="card">
      <h3>Commandes</h3>
      <p>Total: <span id="commandTotal">0</span></p>
      <p>Dernière: <span id="commandLast">-</span></p>
    </div>
    <div class="card">
      <h3>Rendus</h3>
      <p>Total: <span id="renduTotal">0</span></p>
      <p>Dernier: <span id="renduLast">-</span></p>
    </div>
    <div class="card">
      <h3>Copywriting</h3>
      <p>Total: <span id="copyTotal">0</span></p>
      <p>Envoyés: <span id="copySend">0</span></p>
    </div>
    <div class="card">
      <h3>Abonnement annuel</h3>
      <p>Début: <span id="annualStart">-</span></p>
      <p>Expiration: <span id="annualEnd">-</span></p>
    </div>
    <div class="card">
      <h3>Payments</h3>
      <p>Montant: <span id="paymentAmount">-</span></p>
      <p>Expiration: <span id="paymentExp">-</span></p>
    </div>
  </div>

  <!-- MESSAGERIE -->
  <section class="chat-section">
    <div class="chat-header">
      <h3>Messagerie CBC</h3>
      <span class="unread" id="unreadCount">0</span>
    </div>
    <div class="chat-list" id="chatList">
      <!-- Conversations insérées ici via JS -->
    </div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

// --- CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyBla3D7OS8-Hx82m8Tz6ZPIS7FSLury3ew",
    authDomain: "cbc-business.firebaseapp.com",
    projectId: "cbc-business",
    storageBucket: "cbc-business.appspot.com",
    messagingSenderId: "295952883135",
    appId: "1:295952883135:web:4624174a452c1f6aad950a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- UTILITAIRES ---
const $ = id => document.getElementById(id);

// --- AUTH ---
onAuthStateChanged(auth, async user => {
    if (!user) {
        alert("Non connecté. Redirection...");
        window.location.href = "login.html";
        return;
    }

    const userQuery = query(collection(db, "users"), where("userID", "==", user.uid));
    onSnapshot(userQuery, snapshot => {
        if (!snapshot.empty) {
            const data = snapshot.docs[0].data();
            $("userName").textContent = data.name || "-";
            $("userEmail").textContent = data.email || "-";
            $("userType").textContent = data.type || "-";
            $("profilePic").src = data.photoURL || "https://picsum.photos/120/120";
        }
    });

    // --- UPDATE PHOTO ---
    $("updatePhoto").addEventListener("click", async () => {
        const photoURL = $("photoURL").value.trim();
        if (!photoURL) return alert("Lien vide.");
        const userDocRef = query(collection(db, "users"), where("userID", "==", user.uid));
        const snap = await getDocs(userDocRef);
        if (!snap.empty) await updateDoc(snap.docs[0].ref, { photoURL });
        $("profilePic").src = photoURL;
    });

    // --- ANNONCES ---
    const annoncesRef = query(collection(db, "annonces"), where("userID", "==", user.uid));
    onSnapshot(annoncesRef, snapshot => {
        let totalClicks = 0;
        $("annonceCount").textContent = snapshot.size;
        snapshot.forEach(doc => totalClicks += doc.data().clicks || 0);
        $("totalClicks").textContent = totalClicks;
    });

    // --- COMMANDES ---
    const cmdRef = query(collection(db, "commands"), where("userID", "==", user.uid), orderBy("date_commande", "desc"));
    onSnapshot(cmdRef, snapshot => {
        $("commandTotal").textContent = snapshot.size;
        if (!snapshot.empty) $("commandLast").textContent = snapshot.docs[0].data().date_commande?.toDate().toLocaleDateString() || "-";
    });

    // --- RENDUS ---
    const renduRef = query(collection(db, "rendus"), where("byID", "==", user.uid), orderBy("date_rendu", "desc"));
    onSnapshot(renduRef, snapshot => {
        $("renduTotal").textContent = snapshot.size;
        if (!snapshot.empty) $("renduLast").textContent = snapshot.docs[0].data().date_rendu?.toDate().toLocaleDateString() || "-";
    });

    // --- COPYWRITING ---
    const copyRef = query(collection(db, "copywriting"), where("userID", "==", user.uid), orderBy("start_date", "desc"));
    onSnapshot(copyRef, snapshot => {
        $("copyTotal").textContent = snapshot.size;
        if (!snapshot.empty) {
            const lastCopy = snapshot.docs[0].data();
            $("copySend").textContent = lastCopy.send || 0;
        }
    });

    // --- PAYMENTS / ABONNEMENT ANNUEL ---
    const paymentRef = query(collection(db, "payments"), where("userID", "==", user.uid), orderBy("timestamp", "desc"), limit(1));
    onSnapshot(paymentRef, snapshot => {
        if (!snapshot.empty) {
            const p = snapshot.docs[0].data();
            $("paymentAmount").textContent = p.amount || "-";
            $("paymentExp").textContent = p.expiration?.toDate().toLocaleDateString() || "-";
        }
    });

    const annualRef = query(collection(db, "annual"), where("userID", "==", user.uid));
    onSnapshot(annualRef, snapshot => {
        if (!snapshot.empty) {
            const a = snapshot.docs[0].data();
            $("annualStart").textContent = a.creation?.toDate().toLocaleDateString() || "-";
            $("annualEnd").textContent = a.exprireAt?.toDate().toLocaleDateString() || "-";
        }
    });

    // --- MESSAGERIE CBC ---
    const chatRef = query(collection(db, "messages"), where("participants", "array-contains", user.uid), orderBy("lastMsgTime", "desc"));
    onSnapshot(chatRef, snapshot => {
        $("chatList").innerHTML = "";
        let unreadCount = 0;
        snapshot.forEach(doc => {
            const msg = doc.data();
            const otherUser = msg.participants.find(uid => uid !== user.uid);
            const avatar = msg.photoURL || "https://picsum.photos/40/40";
            const lastMsg = msg.lastMsg || "";
            if (!msg.readBy?.includes(user.uid)) unreadCount++;
            $("chatList").innerHTML += `
                <div class="chat-item">
                    <img src="${avatar}" alt="avatar">
                    <div class="info">
                        <span class="name">${msg.name || "Utilisateur"}</span>
                        <span class="last-msg">${lastMsg}</span>
                    </div>
                </div>`;
        });
        $("unreadCount").textContent = unreadCount;
    });

}); // onAuthStateChanged

// LOGOUT
document.querySelector(".logout").addEventListener("click", () => {
    signOut(auth).then(() => window.location.href="login.html");
});
</script>
</body>
</html>
