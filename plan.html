<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Plans & Options – CBC Business</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#F8FAFC;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:800px;
      margin:auto;
      background:#fff;
      padding:25px;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h1{
      margin-top:0;
      color:#0B5FFF;
    }

    .badge{
      display:inline-block;
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
      font-weight:600;
      margin-bottom:15px;
    }

    .badge.manual{
      background:#FFE8E8;
      color:#B00020;
    }

    .badge.soon{
      background:#FFF6D6;
      color:#9A6B00;
    }

    ul{
      padding-left:20px;
    }

    li{
      margin-bottom:8px;
    }

    .info{
      margin-top:20px;
      padding:15px;
      background:#F1F5F9;
      border-radius:10px;
      font-size:14px;
    }

    .actions{
      margin-top:25px;
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      padding:12px 18px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      display:inline-block;
    }

    .btn-primary{
      background:#0B5FFF;
      color:#fff;
    }

    .btn-outline{
      border:1px solid #0B5FFF;
      color:#0B5FFF;
      background:#fff;
    }
  </style>
</head>
<body>

<div class="container">

  <h1 id="plan-title">Plan CBC Business</h1>

  <span class="badge manual">Paiement manuel pour l’instant</span>

  <div id="plan-content"></div>

  <div class="info">
    ⚠️ <strong>Important :</strong>  
    Les paiements automatiques (Orange Money, M-Pesa…) ne sont pas encore activés.  
    Les options <strong>Urgent</strong>, <strong>Boost</strong> et <strong>Ciblé</strong> sont appliquées manuellement par l’administration après confirmation.
  </div>

  <div class="actions">
    <a href="create-annonce.html" class="btn btn-primary">Publier une annonce</a>
    <a href="contact.html" class="btn btn-outline">Contacter l’administration</a>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");

  const title = document.getElementById("plan-title");
  const content = document.getElementById("plan-content");

  let html = "";

  switch(type){
    case "urgent":
      title.textContent = "Option Urgent – 4$";
      html = `
        <ul>
          <li>Badge <strong>Urgent</strong> rouge</li>
          <li>Annonce affichée en haut des listes</li>
          <li>Durée selon accord avec l’administration</li>
        </ul>
      `;
      break;

    case "boost":
      title.textContent = "Option Boost – 5$";
      html = `
        <ul>
          <li>Annonce affichée jusqu’à <strong>5 fois</strong> en priorité</li>
          <li>Présence dans la section vedette de l’accueil</li>
        </ul>
      `;
      break;

    case "cible":
      title.textContent = "Option Ciblée – 10$/jour";
      html = `
        <ul>
          <li>Diffusion ciblée par métier / catégorie</li>
          <li>Notification Email et SMS</li>
          <li>Durée personnalisée</li>
        </ul>
      `;
      break;

    case "pack":
      title.textContent = "Pack Complet – 18$";
      html = `
        <ul>
          <li>Urgent</li>
          <li>Boost</li>
          <li>Ciblé (1 jour)</li>
        </ul>
      `;
      break;

    default:
      title.textContent = "Plans & Options CBC Business";
      html = `
        <ul>
          <li>Compte gratuit disponible</li>
          <li>Options premium à activer manuellement</li>
          <li>Paiement automatique bientôt disponible</li>
        </ul>
      `;
  }

  content.innerHTML = html;
</script>

</body>
</html>
