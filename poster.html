<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster une mission – CBC Business</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f6f9; }
  header { background:#0B5FFF; color:white; padding:15px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  header .logo { font-weight:bold; font-size:20px; }
  header nav a { color:white; text-decoration:none; margin-left:15px; font-weight:500; }
  .container { max-width: 720px; margin:40px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
  h2 { text-align:center; margin-bottom:25px; }
  .input-group { margin-bottom:15px; }
  .input-group label { display:block; font-weight:600; margin-bottom:6px; }
  .input-group input, .input-group textarea, .input-group select { width:90%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:15px; }
  .input-group textarea { resize: vertical; min-height:100px; }
  .btn { display:block; width:90%; padding:14px; background:#0B5FFF; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; margin-top:10px; }
  .alert { padding:12px; border-radius:6px; margin-bottom:15px; display:none; }
  .alert.error { background:#f8d7da; color:#721c24; }
  .alert.success { background:#d4edda; color:#155724; }

  /* AJOUT SIMPLE POUR LA SECTION COMMENTAIRE */
  .comment-section {
    margin-top:50px;
    padding-top:30px;
    border-top:1px solid #ddd;
  }
  .rating-stars {
  display: flex;
  flex-direction: row-reverse;
  justify-content: flex-end;
  gap: 5px;
  font-size: 25px;
  margin: 10px 0;
}

.rating-stars input {
  display: none; /* on cache les radio buttons */
}

.rating-stars label {
  cursor: pointer;
  color: #ccc;
  transition: color 0.2s;
}

.rating-stars input:checked ~ label,
.rating-stars label:hover,
.rating-stars label:hover ~ label {
  color: gold;
}
</style>
</head>

<!-- Ajouter ce div juste après ton bouton Publier l’annonce dans ton HTML -->
<div id="verifyDiv" style="display:none; margin-top:15px; text-align:center;">
  <p>Votre compte n'est pas vérifié. Voulez-vous être vérifié par l’admin ?</p>
  <button id="verifyNowBtn" class="btn" style="width:auto; margin-right:10px;">Maintenant</button>
  <button id="verifyLaterBtn" class="btn" style="width:auto; background:#ccc; color:#000;">Plus tard</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  query,
  where,
  serverTimestamp,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBla3D7OS8-Hx82m8Tz6ZPIS7FSLury3ew",
  authDomain: "cbc-business.firebaseapp.com",
  projectId: "cbc-business",
  storageBucket: "cbc-business.firebasestorage.app",
  messagingSenderId: "295952883135",
  appId: "1:295952883135:web:4624174a452c1f6aad950a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= UI HELPERS ================= */
const alertBox = document.getElementById("alertBox");

function showAlert(type, msg) {
  alertBox.className = "alert " + type;
  alertBox.textContent = msg;
  alertBox.style.display = "block";
}

/* ================= UTILS ================= */
function startOfMonth() {
  const d = new Date();
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return Timestamp.fromDate(d);
}

function hasActiveSubscription(abonnements = []) {
  const now = new Date();
  return abonnements.some(a => new Date(a.expires) > now);
}

/* ================= MAIN ================= */
let currentUserData = null;

onAuthStateChanged(auth, async user => {
  if (!user) {
    showAlert("error", "Vous devez être connecté.");
    return;
  }

  const q = query(collection(db, "users"), where("userID", "==", user.uid));
  const snap = await getDocs(q);

  if (snap.empty) {
    showAlert("error", "Profil utilisateur introuvable.");
    return;
  }

  currentUserData = {
    id: snap.docs[0].id,
    ...snap.docs[0].data()
  };
});

/* ================= POST ANNONCE ================= */
document.getElementById("postBtn").addEventListener("click", async () => {
  alertBox.style.display = "none";

  const user = auth.currentUser;
  if (!user || !currentUserData) return;

  const titre = document.getElementById("titre").value.trim();
  const description = document.getElementById("description").value.trim();
  const categorie = document.getElementById("categorie").value;
  const ville = document.getElementById("ville").value;
  const province = document.getElementById("province").value;

  if (!titre || !description || !categorie || !ville || !province) {
    showAlert("error", "Veuillez remplir tous les champs obligatoires.");
    return;
  }

  const tagsRaw = document.getElementById("tags")?.value || "";
  const tags = tagsRaw.split(",").map(t => t.trim()).filter(Boolean);

  const lieu = document.getElementById("lieu")?.value.trim() || "";
  const licence = document.getElementById("licence")?.value || "";
  const salaire = Number(document.getElementById("salaire")?.value || 0);
  const pdf_url = document.getElementById("pdf_url")?.value.trim() || "";

  /* ===== LIMITATION NON ABONNÉ ===== */
  const qAds = query(
    collection(db, "annonces"),
    where("userID", "==", user.uid),
    where("date_creation", ">=", startOfMonth())
  );

  const adsSnap = await getDocs(qAds);
  const hasSub = hasActiveSubscription(currentUserData.abonnements || []);

  if (!hasSub && adsSnap.size >= 2) {
    showAlert("error", "Limite atteinte (2 annonces/mois sans abonnement).");
    return;
  }

  /* ================= BOOST LOGIC ================= */
  const userHasBoost = currentUserData.boost === true;
  const boostValue = userHasBoost === true;

  /* ================= CREATE ANNONCE ================= */
  const annonceRef = await addDoc(collection(db, "annonces"), {
    userID: user.uid,
    titre,
    description,
    categorie,
    tags,
    ville,
    province,
    lieu,
    licence,
    salaire,
    pdf_url,
    etat: "actif",
    urgence: false,
    copywriting: false,
    boost: boostValue,
    connecte: false,
    verified: currentUserData.verified === true,
    date_creation: serverTimestamp()
  });

  /* ================= VERIFIED / NOT VERIFIED ================= */
  if (!currentUserData.verified) {
    showAlert("success", "Annonce publiée. Votre compte n'est pas vérifié.");

    const verifyDiv = document.getElementById("verifyDiv");
    verifyDiv.style.display = "block";
 document.getElementById("verifyNowBtn").onclick = () => {
      window.location.href = "getVerified.html";
    };
 document.getElementById("verifyLaterBtn").onclick = () => {
      window.location.href = "dashboard.html";
    };

    return;
  }

  showAlert("success", "Annonce publiée avec succès.");
  setTimeout(() => location.href = "dashboard.html", 1500);
});

/* ================= AVIS / COMMENTAIRES ================= */
const commentText = document.getElementById("commentText");
const commentNameInput = document.getElementById("commentName");
const commentBtn = document.getElementById("commentBtn");
const commentAlert = document.getElementById("commentAlert");

commentBtn.addEventListener("click", async () => {
  commentAlert.style.display = "none";

  const user = auth.currentUser;
  if (!user || !currentUserData) {
    showAlert("error", "Vous devez être connecté pour poster un commentaire.");
    return;
  }

  const comment = commentText.value.trim();
  if (comment.length < 5) {
    commentAlert.textContent = "Le commentaire est trop court.";
    commentAlert.className = "alert error";
    commentAlert.style.display = "block";
    return;
  }

  const rating = document.querySelector('input[name="commentRating"]:checked')?.value || 0;

  // Récupérer le vrai nom depuis users si vide
  const name = commentNameInput.value.trim() || currentUserData.name || "Anonyme";

  await addDoc(collection(db, "comments"), {
    userID: user.uid,
    name,
    comment,
    status:"pending",
    rating: parseInt(rating),
    timestamp: serverTimestamp()
  });

  commentAlert.textContent = "Merci pour votre commentaire 🌟";
  commentAlert.className = "alert success";
  commentAlert.style.display = "block";

  // reset form
  commentText.value = "";
  commentNameInput.value = "";
  document.querySelectorAll('input[name="commentRating"]').forEach(r => r.checked = false);
});
</script>
</body>
</html>
